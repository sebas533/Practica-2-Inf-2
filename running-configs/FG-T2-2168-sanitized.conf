#config-version=FGVMK6-7.0.9-FW-build0444-221121:opmode=0:vdom=0:user=admin
# ============================================================
# FG-T2-2168  (FortiGate VM 7.0.9)  -  Práctica #2, Topología #2
# EXTRACTO SANITIZADO: solo interfaces, DHCP, objetos, VPN,
# políticas y rutas. Se omitieron certificados, claves privadas,
# hashes de contraseñas y la PSK (<PSK-OMITIDA>).
# ============================================================

config system interface
    edit "port1"
        set vdom "root"
        set ip 21.68.3.2 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "WAN-ISP"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set type physical
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.11.2 255.255.255.0
        set allowaccess ping https http
        set type physical
    next
    edit "VLAN10-USERS"
        set vdom "root"
        set ip 10.21.68.1 255.255.255.128
        set allowaccess ping
        set device-identification enable
        set role lan
        set interface "port2"
        set vlanid 10
    next
    edit "VPN-FG-CISCO"
        set vdom "root"
        set type tunnel
        set interface "port1"
    next
end

config system dhcp server
    edit 2
        set default-gateway 10.21.68.1
        set netmask 255.255.255.128
        set interface "VLAN10-USERS"
        config ip-range
            edit 1
                set start-ip 10.21.68.10
                set end-ip 10.21.68.100
            next
        end
        set dns-server1 8.8.8.8
        set dns-server2 1.1.1.1
    next
end

config firewall address
    edit "VLAN10-USERS address"
        set type interface-subnet
        set subnet 10.21.68.1 255.255.255.128
        set interface "VLAN10-USERS"
    next
    edit "VPN-FG-CISCO_local_subnet_1"
        set allow-routing enable
        set subnet 10.21.68.0 255.255.255.128
    next
    edit "VPN-FG-CISCO_remote_subnet_1"
        set allow-routing enable
        set subnet 10.21.68.128 255.255.255.240
    next
end

config firewall addrgrp
    edit "VPN-FG-CISCO_local"
        set member "VPN-FG-CISCO_local_subnet_1"
        set comment "VPN: VPN-FG-CISCO (Created by VPN wizard)"
        set allow-routing enable
    next
    edit "VPN-FG-CISCO_remote"
        set member "VPN-FG-CISCO_remote_subnet_1"
        set comment "VPN: VPN-FG-CISCO (Created by VPN wizard)"
        set allow-routing enable
    next
end

config vpn ipsec phase1-interface
    edit "VPN-FG-CISCO"
        set interface "port1"
        set peertype any
        set net-device disable
        set proposal des-md5 des-sha1
        set comments "VPN: VPN-FG-CISCO (Created by VPN wizard)"
        set remote-gw 21.68.4.2
        set psksecret <PSK-OMITIDA>
    next
end

config vpn ipsec phase2-interface
    edit "VPN-FG-CISCO"
        set phase1name "VPN-FG-CISCO"
        set proposal des-md5 des-sha1
        set comments "VPN: VPN-FG-CISCO (Created by VPN wizard)"
        set src-addr-type name
        set dst-addr-type name
        set src-name "VPN-FG-CISCO_local"
        set dst-name "VPN-FG-CISCO_remote"
    next
end

config firewall policy
    edit 1
        set name "USER-TO-INTERNET"
        set srcintf "VLAN10-USERS"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "vpn_VPN-FG-CISCO_local_0"
        set srcintf "VLAN10-USERS"
        set dstintf "VPN-FG-CISCO"
        set action accept
        set srcaddr "VPN-FG-CISCO_local"
        set dstaddr "VPN-FG-CISCO_remote"
        set schedule "always"
        set service "ALL"
        set comments "VPN: VPN-FG-CISCO (Created by VPN wizard)"
    next
    edit 3
        set name "vpn_VPN-FG-CISCO_remote_0"
        set srcintf "VPN-FG-CISCO"
        set dstintf "VLAN10-USERS"
        set action accept
        set srcaddr "VPN-FG-CISCO_remote"
        set dstaddr "VPN-FG-CISCO_local"
        set schedule "always"
        set service "ALL"
        set comments "VPN: VPN-FG-CISCO (Created by VPN wizard)"
    next
end

config router static
    edit 1
        set gateway 21.68.3.1
        set device "port1"
    next
    edit 2
        set device "VPN-FG-CISCO"
        set comment "VPN: VPN-FG-CISCO (Created by VPN wizard)"
        set dstaddr "VPN-FG-CISCO_remote"
    next
    edit 3
        set distance 254
        set comment "VPN: VPN-FG-CISCO (Created by VPN wizard)"
        set blackhole enable
        set dstaddr "VPN-FG-CISCO_remote"
    next
end
